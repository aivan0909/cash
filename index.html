<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>股票計算工具｜土豪金版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0800;--bg2:#110E00;--bg3:#1A1500;--bg4:#221C00;--bg5:#2A2200;
  --field-bg:#F5EED8;--field-text:#1A1400;--field-placeholder:#8A7A50;--field-border:rgba(200,150,12,0.5);--field-focus-bg:#FFFBF0;
  --gold:#C8960C;--gold2:#E8B020;--gold3:#FFD060;--gold4:#FFF0A0;
  --gold-glow:rgba(200,150,12,0.22);--gold-dim:rgba(200,150,12,0.08);--gold-border:rgba(200,150,12,0.22);--gold-border2:rgba(200,150,12,0.45);
  --green:#C0392B;--green-light:#FBE9E7;
  --red:#2E9E50;--red-light:#E8F8ED;
  --text:#F5E8C0;--text2:#E8C060;--text3:#604E20;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans TC',sans-serif;--display:'Cinzel',serif;
  --radius:10px;--radius-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(45deg,rgba(200,150,12,0.025) 0,rgba(200,150,12,0.025) 1px,transparent 1px,transparent 40px),repeating-linear-gradient(-45deg,rgba(200,150,12,0.025) 0,rgba(200,150,12,0.025) 1px,transparent 1px,transparent 40px);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(200,150,12,0.07),transparent 70%);pointer-events:none;z-index:0}
.container{max-width:720px;margin:0 auto;padding:20px 14px 80px;position:relative;z-index:1}

header{text-align:center;margin-bottom:28px;padding:28px 0 20px;position:relative}
header::after{content:'';display:block;width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);margin:16px auto 0}
.crown{font-size:28px;margin-bottom:8px;filter:drop-shadow(0 0 10px var(--gold))}
h1{font-family:var(--display);font-size:clamp(18px,5vw,26px);font-weight:700;letter-spacing:0.1em;background:linear-gradient(135deg,var(--gold) 0%,var(--gold3) 40%,var(--gold4) 55%,var(--gold3) 70%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.3}
.header-sub{font-size:clamp(10px,2.5vw,12px);font-family:var(--mono);color:var(--text3);margin-top:8px;letter-spacing:0.14em;text-transform:uppercase}
.header-line{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.header-line::before,.header-line::after{content:'';flex:1;max-width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border2))}
.header-badge{font-family:var(--mono);font-size:12px;color:var(--gold2);letter-spacing:0.15em;padding:4px 14px;border:1px solid var(--gold-border2);border-radius:99px;background:var(--gold-dim)}
.ornament{color:var(--gold);opacity:0.5;font-size:13px;letter-spacing:4px;text-align:center;margin-bottom:18px}

.tabs{display:flex;background:var(--bg2);border:1px solid var(--gold-border);border-radius:var(--radius-lg);padding:4px;margin-bottom:20px;gap:3px;position:relative;overflow:hidden}
.tabs::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);opacity:0.6}
.tab{flex:1;padding:10px 4px;font-size:clamp(13px,3vw,15px);font-weight:500;background:transparent;border:none;cursor:pointer;color:#E8C060;transition:all 0.25s;border-radius:var(--radius);font-family:var(--sans);letter-spacing:0.01em;-webkit-tap-highlight-color:transparent}
.tab.active{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 50%,var(--gold3) 100%);color:#0A0800;font-weight:700;box-shadow:0 0 20px var(--gold-glow)}
.tab:not(.active):hover{background:var(--bg4);color:#FFD060}
.section{display:none}.section.active{display:block}

.card{background:var(--bg2);border:1px solid var(--gold-border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),var(--gold3),var(--gold2),transparent);opacity:0.7}
.card::after{content:'';position:absolute;top:0;left:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--gold2),transparent);opacity:0.4}

.broker-label{font-size:12px;font-family:var(--mono);color:var(--text3);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.broker-label::before{content:'◆';color:var(--gold);font-size:8px}
.broker-btns{display:flex;gap:6px;margin-bottom:14px}
.broker-btn{flex:1;padding:10px 4px;font-size:clamp(13px,3vw,15px);font-weight:500;border:1px solid var(--gold-border);border-radius:var(--radius);background:var(--bg3);color:#E8C060;cursor:pointer;transition:all 0.2s;font-family:var(--sans);-webkit-tap-highlight-color:transparent;min-height:42px}
.broker-btn:hover{border-color:var(--gold-border2);color:#FFD060;background:var(--bg4)}
.broker-btn.active{background:linear-gradient(135deg,var(--bg4),var(--bg5));border-color:var(--gold2);color:var(--gold3);box-shadow:0 0 10px var(--gold-glow)}
.broker-info-box{background:#F5EED8;border:1px solid rgba(200,150,12,0.4);border-left:3px solid var(--gold2);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px}
.broker-info-box div{font-size:12px;color:#3A2E10;line-height:2;font-family:var(--mono)}
.gold-hr{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.gold-hr::before,.gold-hr::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border))}
.gold-hr span{font-size:12px;color:var(--text3);letter-spacing:0.18em;font-family:var(--mono)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.field label{font-size:12px;font-family:var(--mono);letter-spacing:0.1em;text-transform:uppercase;display:block;margin-bottom:6px;color:var(--gold2)}
input[type=number],input[type=text]{width:100%;padding:12px 14px;font-size:16px;font-family:var(--mono);font-weight:500;border:1.5px solid var(--field-border);border-radius:var(--radius);background:var(--field-bg);color:var(--field-text);outline:none;transition:all 0.2s;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--gold2);background:var(--field-focus-bg);box-shadow:0 0 0 3px var(--gold-glow)}
input::placeholder{color:var(--field-placeholder)}
.qty-wrap{display:flex;align-items:center;gap:4px;width:100%}
.qty-wrap input{flex:1;min-width:0;text-align:center}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
@media(max-width:360px){.btn-row{grid-template-columns:1fr}}
.calc-btn{width:100%;padding:14px;font-size:15px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;font-family:var(--sans);letter-spacing:0.04em;background:linear-gradient(135deg,#8B6200 0%,var(--gold) 30%,var(--gold3) 55%,var(--gold2) 75%,#8B6200 100%);color:#0A0800;position:relative;overflow:hidden;transition:all 0.2s;box-shadow:0 2px 16px rgba(200,150,12,0.35);min-height:48px;-webkit-tap-highlight-color:transparent}
.calc-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent 50%);pointer-events:none}
.calc-btn:active{transform:scale(0.98)}
.compare-btn{width:100%;padding:14px;font-size:15px;font-weight:500;background:rgba(245,238,216,0.06);color:var(--gold2);border:1.5px solid var(--gold-border2);border-radius:var(--radius);cursor:pointer;transition:all 0.2s;font-family:var(--sans);display:none;letter-spacing:0.03em;min-height:48px;-webkit-tap-highlight-color:transparent}
.compare-btn:active{background:var(--gold-dim)}

.result-card{background:var(--bg2);border:1px solid var(--gold-border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:14px;display:none;position:relative}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),var(--gold3),var(--gold2),transparent);opacity:0.7}
.result-section{padding:12px 16px}
.result-section+.result-section{border-top:1px solid rgba(200,150,12,0.08)}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin:2px 0;border-radius:7px;font-size:13px;background:rgba(245,238,216,0.04)}
.detail-row:nth-child(even){background:rgba(245,238,216,0.09)}
.detail-label{color:var(--text2);flex:1;padding-right:8px}
.detail-val{font-family:var(--mono);font-weight:500;color:#F5EED8;white-space:nowrap}
/* 台股慣例：獲利=紅色，虧損=綠色 */
.profit{color:#E84040!important}
.loss{color:#2E9E50!important}
.pnl-big.profit{color:#E84040!important}
.pnl-big.loss{color:#2E9E50!important}
.pnl-pill.profit{background:#FDEAEA;color:#C0392B!important;border:1px solid rgba(192,57,43,0.25)}
.pnl-pill.loss{background:#E8F8ED;color:#2E9E50!important;border:1px solid rgba(46,158,80,0.25)}
.pnl-row{display:flex;justify-content:space-between;align-items:flex-end;padding:18px;background:linear-gradient(135deg,#1A1500,#221C00);border-top:1px solid rgba(200,150,12,0.18);border-bottom:1px solid rgba(200,150,12,0.18);flex-wrap:wrap;gap:12px}
.pnl-label{font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:5px}
.pnl-big{font-size:clamp(22px,6vw,30px);font-weight:700;font-family:var(--mono);letter-spacing:-0.02em}
.pnl-pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-family:var(--mono);font-weight:500;margin-top:5px}
.pnl-pill.profit{background:var(--green-light);color:var(--green)}
.pnl-pill.loss{background:var(--red-light);color:var(--red)}
.note-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;margin-left:5px;background:rgba(200,150,12,0.12);color:var(--gold2);font-family:var(--mono);vertical-align:middle;border:1px solid rgba(200,150,12,0.3)}

/* ── 價格試算表 ── */
.price-table-panel{display:none;margin-bottom:14px}
.price-table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.price-table-title{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
.price-table-title-icon{width:3px;height:16px;background:linear-gradient(180deg,var(--gold3),var(--gold));border-radius:2px;box-shadow:0 0 6px var(--gold)}
.close-btn{width:32px;height:32px;background:var(--bg3);border:1px solid var(--gold-border);border-radius:8px;color:var(--text3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.price-table-info{font-size:11px;font-family:var(--mono);background:#F5EED8;color:#3A2E10;border:1px solid rgba(200,150,12,0.35);border-left:3px solid var(--gold2);border-radius:var(--radius);padding:9px 12px;margin-bottom:12px;line-height:1.9}
.price-table-info span{display:inline-block;margin-right:14px}
.price-table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--gold-border)}
.price-table-wrap::-webkit-scrollbar{height:4px}
.price-table-wrap::-webkit-scrollbar-track{background:var(--bg3)}
.price-table-wrap::-webkit-scrollbar-thumb{background:var(--gold-border2);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
thead tr{background:linear-gradient(135deg,var(--bg4),var(--bg5));border-bottom:1px solid var(--gold-border2)}
thead th{padding:10px 8px;color:var(--gold2);font-weight:500;letter-spacing:0.06em;text-align:right;white-space:nowrap}
thead th:first-child{text-align:center}
tbody tr{border-bottom:1px solid rgba(200,150,12,0.10);transition:background 0.15s}
tbody tr:nth-child(odd){background:#F5EED8}
tbody tr:nth-child(even){background:#EDE4C8}
tbody tr:hover{background:#FFE8A0}
tbody tr.highlight{background:linear-gradient(135deg,#FFD060,#F5C030)!important;border-left:3px solid var(--gold)}
tbody td{padding:9px 8px;color:#2A1E08;text-align:right;white-space:nowrap;font-weight:500}
tbody td:first-child{text-align:center;color:#6B4800;font-weight:700}
tbody tr.highlight td{color:#1A0E00;font-weight:700}
tbody tr.highlight td:first-child{color:#3A1800}
/* 試算表損益欄：只有文字顏色，無底色 */
.td-profit{color:#C0392B!important;font-weight:700!important}
.td-loss{color:#1E7A3A!important;font-weight:700!important}

/* ── Compare ── */
.compare-panel{display:none;margin-bottom:14px}
.compare-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.compare-title{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
.compare-title-icon{width:3px;height:16px;background:linear-gradient(180deg,var(--gold3),var(--gold));border-radius:2px;box-shadow:0 0 6px var(--gold)}
.compare-summary{font-size:11px;font-family:var(--mono);background:#F5EED8;color:#3A2E10;border:1px solid rgba(200,150,12,0.35);border-left:3px solid var(--gold2);border-radius:var(--radius);padding:9px 12px;margin-bottom:12px;line-height:1.8}
.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:500px){.compare-grid{grid-template-columns:1fr}}
.cc{background:var(--bg3);border:1px solid var(--gold-border);border-radius:var(--radius-lg);padding:14px 11px;position:relative;overflow:hidden}
.cc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border2),transparent)}
.cc.best{border-color:var(--gold2);background:linear-gradient(160deg,var(--bg3),var(--bg5));box-shadow:0 0 24px rgba(200,150,12,0.18)}
.cc.best::before{background:linear-gradient(90deg,transparent,var(--gold3),transparent);opacity:0.9}
.best-badge{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--gold) 0%,var(--gold3) 50%,var(--gold) 100%);color:#0A0800;font-size:9px;font-weight:700;padding:3px 10px;border-radius:0 0 7px 7px;white-space:nowrap;font-family:var(--mono);letter-spacing:0.08em}
.cc-name{font-size:11px;font-family:var(--mono);color:var(--text3);text-align:center;margin:10px 0 8px;letter-spacing:0.06em}
.cc.best .cc-name{color:var(--gold2)}
.cc-pnl{font-size:19px;font-weight:700;font-family:var(--mono);text-align:center;margin-bottom:9px;letter-spacing:-0.02em}
/* ★ 米白底比較卡片列 */
.cc-row{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;font-size:11px;background:#F5EED8;margin-bottom:3px;border:1px solid rgba(200,150,12,0.15)}
.cc-row:nth-child(even){background:#EDE4C8}
.cc-lbl{color:#6B4800;font-family:var(--mono)}
.cc-v{color:#2A1E08;font-family:var(--mono);font-weight:600}
.cc-v.profit{color:#C0392B!important}
.cc-v.loss{color:#1E7A3A!important}

/* ── Limit ── */
.limit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lcard{border-radius:var(--radius-lg);padding:20px 12px;text-align:center;position:relative;overflow:hidden}
.lcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px}
.lcard.up{background:linear-gradient(135deg,#2A0800,rgba(192,57,43,0.18));border:1px solid rgba(192,57,43,0.35)}
.lcard.up::before{background:linear-gradient(90deg,transparent,#C0392B,transparent);opacity:0.6}
.lcard.dn{background:linear-gradient(135deg,#001A08,rgba(46,158,80,0.18));border:1px solid rgba(46,158,80,0.35)}
.lcard.dn::before{background:linear-gradient(90deg,transparent,#2E9E50,transparent);opacity:0.6}
.lcard .lt{font-size:10px;font-family:var(--mono);margin-bottom:8px;letter-spacing:0.12em;text-transform:uppercase}
.lcard.up .lt{color:#E07060}.lcard.dn .lt{color:#5DC87A}
.lcard .lv{font-size:clamp(26px,7vw,34px);font-weight:700;font-family:var(--mono);letter-spacing:-0.02em}
.lcard.up .lv{color:#E84040}.lcard.dn .lv{color:#2ECC71}
.lcard .lc{font-size:12px;font-family:var(--mono);margin-top:5px;opacity:0.85}
.lcard.up .lc{color:#E07060}.lcard.dn .lc{color:#5DC87A}
.tick-info{font-size:11px;font-family:var(--mono);color:#5A4820;margin-top:12px;padding:10px 12px;background:#F5EED8;border-radius:var(--radius);border:1px solid rgba(200,150,12,0.3);line-height:1.8}

/* ── Avg ── */
.avg-row-wrap{display:flex;align-items:flex-start;gap:6px;margin-bottom:10px}
.avg-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
@media(max-width:560px){.avg-fields{grid-template-columns:1fr}}
.row-num{width:22px;height:22px;border-radius:50%;background:var(--bg4);border:1px solid var(--gold-border);font-size:10px;font-family:var(--mono);color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:28px}
.icon-btn{width:36px;height:36px;background:#F5EED8;border:1px solid rgba(200,150,12,0.4);border-radius:var(--radius);color:#5A4820;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;font-size:16px;font-weight:700;-webkit-tap-highlight-color:transparent;min-width:36px}
.icon-btn:active{background:#EDE4C8;border-color:var(--gold2)}
.icon-btn.del{background:var(--red-light);border-color:rgba(192,57,43,0.3);color:var(--red);margin-top:22px}
.icon-btn.del:active{background:#F5C6C1}
.add-row-btn{width:100%;padding:11px;font-size:15px;background:rgba(245,238,216,0.04);border:1px dashed rgba(200,150,12,0.4);border-radius:var(--radius);color:#FFD060;cursor:pointer;margin-bottom:10px;transition:all 0.2s;font-family:var(--sans);min-height:44px;-webkit-tap-highlight-color:transparent}
.add-row-btn:active{background:var(--gold-dim);color:var(--gold2)}
.avg-result{display:none}
.avg-big{font-size:clamp(26px,7vw,34px);font-weight:700;font-family:var(--mono);letter-spacing:-0.02em;background:linear-gradient(135deg,var(--gold) 0%,var(--gold3) 50%,var(--gold4) 70%,var(--gold3) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.avg-detail-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin:2px 0;border-radius:7px;font-size:13px;background:rgba(245,238,216,0.04)}
.avg-detail-row:nth-child(even){background:rgba(245,238,216,0.09)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold-border),transparent);margin:10px 0}

footer{text-align:center;padding:24px 0 16px;margin-top:8px}
footer p{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.12em}
footer p span{color:var(--gold);opacity:0.6}
@supports(padding-bottom:env(safe-area-inset-bottom)){.container{padding-bottom:calc(80px + env(safe-area-inset-bottom))}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold-border2);border-radius:2px}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="crown">♛</div>
    <h1>STOCK CALCULATOR</h1>
    <div class="header-line"><div class="header-badge">台股獲利計算工具</div></div>
    <div class="header-sub">新光證券｜獲利 · 漲跌停 · 均價</div>
  </header>
  <div class="ornament">◆ ◇ ◆</div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab(0)">◈ 獲利計算</button>
    <button class="tab" onclick="switchTab(1)">◈ 漲跌停</button>
    <button class="tab" onclick="switchTab(2)">◈ 均價計算</button>
  </div>

  <!-- 功能一 -->
  <div class="section active" id="sec0">
    <div class="card">
      <div class="broker-label">選擇券商</div>
      <div class="broker-btns">
        <button class="broker-btn active" onclick="selectBroker('shinekong',this)">新光證券</button>
      </div>
      <div class="broker-info-box" id="broker-info"></div>
      <div class="gold-hr"><span>交易資訊</span></div>
      <div class="row2">
        <div class="field"><label>買進價格（元）</label><input type="number" id="buy-price" placeholder="請輸入買進價格" step="0.5" min="0" inputmode="decimal"></div>
        <div class="field"><label>買進股數</label><input type="number" id="buy-qty" value="1000" placeholder="股數" step="1" min="1" inputmode="numeric"></div>
      </div>
      <div class="row2">
        <div class="field"><label>賣出價格（元）</label><input type="number" id="sell-price" placeholder="請輸入賣出價格" step="0.5" min="0" inputmode="decimal"></div>
        <div class="field"><label>賣出股數</label><input type="number" id="sell-qty" value="1000" placeholder="股數" step="1" min="1" inputmode="numeric"></div>
      </div>
      <div class="btn-row" style="grid-template-columns:1fr">
        <button class="calc-btn" onclick="calcProfit()">▶ 計算獲利</button>
      </div>
    </div>

    <div class="result-card" id="result-area">
      <div class="result-section">
        <div class="detail-row"><span class="detail-label">買進金額</span><span class="detail-val" id="r-buy-amt">—</span></div>
        <div class="detail-row"><span class="detail-label">買進手續費 <span id="r-buy-fee-note" class="note-tag"></span></span><span class="detail-val" id="r-buy-fee">—</span></div>
        <div class="detail-row"><span class="detail-label">持有成本</span><span class="detail-val" id="r-hold-cost">—</span></div>
        <div class="detail-row"><span class="detail-label">每股成本</span><span class="detail-val" id="r-costprice">—</span></div>
      </div>
      <div class="result-section">
        <div class="detail-row"><span class="detail-label">賣出金額</span><span class="detail-val" id="r-sell-amt">—</span></div>
        <div class="detail-row"><span class="detail-label">賣出手續費 <span id="r-sell-fee-note" class="note-tag"></span></span><span class="detail-val" id="r-sell-fee">—</span></div>
        <div class="detail-row"><span class="detail-label">證交稅（0.3%）</span><span class="detail-val" id="r-tax">—</span></div>
      </div>
      <div class="pnl-row">
        <div>
          <div class="pnl-label">淨損益</div>
          <div class="pnl-big" id="r-pnl">—</div>
          <div id="r-pnl-pill"></div>
        </div>
        <div style="text-align:right">
          <div class="pnl-label">報酬率</div>
          <div id="r-roi" style="font-size:clamp(18px,5vw,22px);font-family:var(--mono);font-weight:700">—</div>
        </div>
      </div>
      <div class="result-section">
        <div class="detail-row"><span class="detail-label">損益平衡賣出價</span><span class="detail-val" id="r-breakeven">—</span></div>
      </div>
      <!-- 試算表按鈕 -->
      <div style="padding:12px 16px;border-top:1px solid rgba(200,150,12,0.08)">
        <button class="calc-btn" style="background:linear-gradient(135deg,#3A2A00,var(--gold-border2) 50%,#3A2A00);color:var(--gold3);border:1px solid var(--gold-border2);font-size:13px;padding:11px" onclick="showPriceTable()">📊 上下區間價格試算表</button>
      </div>
    </div>

    <!-- 價格試算表 -->
    <div class="price-table-panel" id="price-table-panel">
      <div class="card">
        <div class="price-table-header">
          <div class="price-table-title"><div class="price-table-title-icon"></div>上下區間價格試算</div>
          <button class="close-btn" onclick="hidePriceTable()">✕</button>
        </div>
        <div class="price-table-info" id="pt-info"></div>
        <div class="price-table-wrap">
          <table id="pt-table">
            <thead>
              <tr>
                <th>賣出價</th>
                <th>損益</th>
                <th>報酬率</th>
                <th>買進費</th>
                <th>賣出費</th>
                <th>證交稅</th>
                <th>投資成本</th>
              </tr>
            </thead>
            <tbody id="pt-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- 功能二 -->
  <div class="section" id="sec1">
    <div class="card">
      <div class="field" style="margin-bottom:8px"><label>昨日收盤價（元）</label><input type="number" id="base-price" placeholder="28.3" step="0.01" min="0" inputmode="decimal"></div>
      <button class="calc-btn" onclick="calcLimit()">▶ 計算漲跌停</button>
    </div>
    <div id="limit-result" style="display:none">
      <div class="card">
        <div id="stock-title" style="font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:6px;letter-spacing:0.08em"></div>
        <div class="limit-grid">
          <div class="lcard up"><div class="lt">▲ 漲停</div><div class="lv" id="up-limit">—</div><div class="lc" id="up-chg">+10%</div></div>
          <div class="lcard dn"><div class="lt">▼ 跌停</div><div class="lv" id="dn-limit">—</div><div class="lc" id="dn-chg">-10%</div></div>
        </div>
        <div class="tick-info" id="tick-info"></div>
      </div>
    </div>
  </div>

  <!-- 功能三 -->
  <div class="section" id="sec2">
    <div class="card">
      <div style="display:grid;grid-template-columns:22px 1fr 1fr 36px;gap:6px;margin-bottom:10px;padding:0 2px">
        <span></span>
        <span style="font-size:10px;font-family:var(--mono);color:var(--gold2);letter-spacing:0.1em;text-transform:uppercase">單價（元）</span>
        <span style="font-size:10px;font-family:var(--mono);color:var(--gold2);letter-spacing:0.1em;text-transform:uppercase">股數</span>
        <span></span>
      </div>
      <div id="avg-rows"></div>
      <button class="add-row-btn" onclick="addAvgRow()">＋ 新增一筆</button>
      <button class="calc-btn" onclick="calcAvg()">▶ 計算均價</button>
    </div>
    <div class="avg-result" id="avg-result">
      <div class="card">
        <div style="margin-bottom:14px">
          <div style="font-size:12px;font-family:var(--mono);color:var(--text3);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:7px">◆ 加權均價</div>
          <div class="avg-big" id="avg-price">—</div>
        </div>
        <div class="divider"></div>
        <div class="avg-detail-row"><span style="color:var(--text2)">總股數</span><span style="font-family:var(--mono);font-weight:500;color:#F5EED8" id="avg-total-qty">—</span></div>
        <div class="avg-detail-row"><span style="color:var(--text2)">總成本</span><span style="font-family:var(--mono);font-weight:500;color:#F5EED8" id="avg-total-cost">—</span></div>
        <div id="avg-breakdown" style="margin-top:4px"></div>
      </div>
    </div>
  </div>
  <footer>
    <p><span>◆</span> © 2026 Van Cheng．版權所有 <span>◆</span></p>
  </footer>
</div>

<script>
let broker='shinekong';
const RATE=0.001425;
let avgRowId=0;

// ★ 新光：2.85折(0.285)，最低10元；國泰：2.8折(0.28)，最低1元；元大買0.58折最低20，賣牌價最低20
const brokerCfg={
  shinekong:{
    label:'新光證券',
    info:['買進手續費：牌價 × 2.85折（0.285），最低 10元','賣出手續費：牌價 × 2.85折（0.285），最低 10元'],
    buyDiscount:0.285,buyMin:10,
    sellDiscount:0.285,sellMin:10,
    buyNote:'2.85折',sellNote:'2.85折'
  },
  cathay:{
    label:'國泰證券',
    info:['買進手續費：牌價 × 2.8折（0.28），最低 1元','賣出手續費：牌價 × 2.8折（0.28），最低 1元'],
    buyDiscount:0.28,buyMin:1,
    sellDiscount:0.28,sellMin:1,
    buyNote:'2.8折',sellNote:'2.8折'
  },
  yuanta:{
    label:'元大證券',
    info:['買進手續費：牌價 × 5.8折（0.58），最低 20元','賣出手續費：牌價未折扣（1.0），最低 20元'],
    buyDiscount:0.58,buyMin:20,
    sellDiscount:1.0,sellMin:20,
    buyNote:'5.8折',sellNote:'牌價未折'
  }
};

function renderBrokerInfo(b){document.getElementById('broker-info').innerHTML=brokerCfg[b].info.map(l=>`<div>${l}</div>`).join('');}
function selectBroker(b,el){broker=b;document.querySelectorAll('.broker-btn').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderBrokerInfo(b);document.getElementById('result-area').style.display='none';document.getElementById('price-table-panel').style.display='none';}

function getBuyFee(amt,b){const c=brokerCfg[b||broker];return Math.max(c.buyMin,Math.round(amt*RATE*c.buyDiscount));}
function getSellFee(amt,b){const c=brokerCfg[b||broker];return Math.max(c.sellMin,Math.round(amt*RATE*c.sellDiscount));}
function calcFees(b,buyAmt,sellAmt){const buyFee=getBuyFee(buyAmt,b);const sellFee=getSellFee(sellAmt,b);const tax=Math.round(sellAmt*0.003);const holdCost=buyAmt+buyFee;const pnl=sellAmt-holdCost-sellFee-tax;return{buyFee,sellFee,tax,holdCost,pnl};}
function fmt(n){return Number(Math.abs(n)>=1?n.toFixed(0):n.toFixed(2)).toLocaleString('zh-TW');}
function fmtSign(n){return(n>=0?'+':'')+fmt(n);}

function calcProfit(){
  const bp=parseFloat(document.getElementById('buy-price').value);
  const bq=parseInt(document.getElementById('buy-qty').value);
  const sp=parseFloat(document.getElementById('sell-price').value);
  const sq=parseInt(document.getElementById('sell-qty').value);
  if(!bp||!bq||!sp||!sq)return;
  const buyAmt=Math.round(bp*bq),sellAmt=Math.round(sp*sq);
  const buyFee=getBuyFee(buyAmt),sellFee=getSellFee(sellAmt);
  const tax=Math.round(sellAmt*0.003);
  const holdCost=buyAmt+buyFee,pnl=sellAmt-holdCost-sellFee-tax;
  const roi=((pnl/holdCost)*100).toFixed(2);
  const c=brokerCfg[broker];
  document.getElementById('r-buy-amt').textContent='$'+fmt(buyAmt);
  document.getElementById('r-buy-fee').textContent='$'+fmt(buyFee);
  document.getElementById('r-buy-fee-note').textContent=c.buyNote;
  document.getElementById('r-hold-cost').textContent='$'+fmt(holdCost);
  document.getElementById('r-costprice').textContent='$'+(holdCost/bq).toFixed(2);
  document.getElementById('r-sell-amt').textContent='$'+fmt(sellAmt);
  document.getElementById('r-sell-fee').textContent='$'+fmt(sellFee);
  document.getElementById('r-sell-fee-note').textContent=c.sellNote;
  document.getElementById('r-tax').textContent='$'+fmt(tax);
  const pe=document.getElementById('r-pnl');
  pe.textContent=(pnl>=0?'+':'')+'$'+fmt(pnl);
  pe.className='pnl-big '+(pnl>=0?'profit':'loss');
  document.getElementById('r-pnl-pill').innerHTML=`<span class="pnl-pill ${pnl>=0?'profit':'loss'}">${pnl>=0?'◆ 獲利':'◆ 虧損'}</span>`;
  const re=document.getElementById('r-roi');
  re.textContent=(pnl>=0?'+':'')+roi+'%';
  re.style.cssText=`font-size:clamp(18px,5vw,22px);font-family:var(--mono);font-weight:700;color:${pnl>=0?'#E84040':'#2E9E50'}`;
  document.getElementById('r-breakeven').textContent='$'+((holdCost/bq)*(1+0.003+RATE*c.sellDiscount)).toFixed(2);
  document.getElementById('result-area').style.display='block';
  document.getElementById('price-table-panel').style.display='none';
  setTimeout(()=>document.getElementById('result-area').scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

// ── 價格試算表 ──
function getTickSize(p){if(p<10)return 0.01;if(p<50)return 0.05;if(p<100)return 0.1;if(p<500)return 0.5;if(p<1000)return 1;return 5;}

function showPriceTable(){
  const bp=parseFloat(document.getElementById('buy-price').value);
  const bq=parseInt(document.getElementById('buy-qty').value);
  const sp=parseFloat(document.getElementById('sell-price').value);
  const sq=parseInt(document.getElementById('sell-qty').value);
  if(!bp||!bq||!sp||!sq)return;

  const buyAmt=Math.round(bp*bq);
  const buyFee=getBuyFee(buyAmt);
  const holdCost=buyAmt+buyFee;
  const tick=getTickSize(sp);
  const rows=10; // 上下各10筆

  // 建立價格列表：從 sp - rows*tick 到 sp + rows*tick
  let prices=[];
  for(let i=-rows;i<=rows;i++){
    prices.push(Math.round((sp+i*tick)*10000)/10000);
  }

  // 更新摘要
  const c=brokerCfg[broker];
  document.getElementById('pt-info').innerHTML=
    `<span>買進價 <b style="color:#3A2E10">${bp} 元</b></span>`+
    `<span>股數 <b style="color:#3A2E10">${bq.toLocaleString('zh-TW')} 股</b></span>`+
    `<span>持有成本 <b style="color:#3A2E10">$${fmt(holdCost)}</b></span>`+
    `<span>券商 <b style="color:#3A2E10">${c.label}</b></span>`;

  // 建立表格
  const dec=tick<0.1?2:tick<1?1:0;
  const tbody=document.getElementById('pt-tbody');
  tbody.innerHTML=prices.map(p=>{
    const sAmt=Math.round(p*sq);
    const sFee=getSellFee(sAmt);
    const tax=Math.round(sAmt*0.003);
    const pnl=sAmt-holdCost-sFee-tax;
    const roi=((pnl/holdCost)*100).toFixed(1);
    const isHighlight=Math.abs(p-sp)<0.0001;
    const pc=pnl>=0?'td-profit':'td-loss';
    return`<tr class="${isHighlight?'highlight':''}">
      <td>${p.toFixed(dec)}</td>
      <td class="${pc}">${fmtSign(pnl)}</td>
      <td class="${pc}">${pnl>=0?'+':''}${roi}%</td>
      <td>${fmt(buyFee)}</td>
      <td>${fmt(sFee)}</td>
      <td>${fmt(tax)}</td>
      <td>${fmt(holdCost+sFee+tax)}</td>
    </tr>`;
  }).join('');

  document.getElementById('price-table-panel').style.display='block';
  setTimeout(()=>document.getElementById('price-table-panel').scrollIntoView({behavior:'smooth',block:'nearest'}),100);

  // 滾動到 highlight 列
  setTimeout(()=>{
    const hl=tbody.querySelector('.highlight');
    if(hl)hl.scrollIntoView({behavior:'smooth',block:'center'});
  },300);
}
function hidePriceTable(){document.getElementById('price-table-panel').style.display='none';}

function showCompare(){
  const bp=parseFloat(document.getElementById('buy-price').value);
  const bq=parseInt(document.getElementById('buy-qty').value);
  const sp=parseFloat(document.getElementById('sell-price').value);
  const sq=parseInt(document.getElementById('sell-qty').value);
  if(!bp||!bq||!sp||!sq)return;
  const buyAmt=Math.round(bp*bq),sellAmt=Math.round(sp*sq);
  const results={};Object.keys(brokerCfg).forEach(b=>{results[b]=calcFees(b,buyAmt,sellAmt);});
  const maxPnl=Math.max(...Object.values(results).map(r=>r.pnl));
  const bestBroker=Object.keys(results).find(b=>results[b].pnl===maxPnl);
  const totalFees={};Object.keys(results).forEach(b=>{totalFees[b]=results[b].buyFee+results[b].sellFee+results[b].tax;});
  const minFee=Math.min(...Object.values(totalFees)),maxFee=Math.max(...Object.values(totalFees));
  document.getElementById('compare-summary').innerHTML=`買進 $${fmt(buyAmt)}　賣出 $${fmt(sellAmt)}<br>三家手續費差距最多 $${fmt(maxFee-minFee)} 元`;
  document.getElementById('compare-grid').innerHTML=Object.keys(brokerCfg).map(b=>{
    const r=results[b];const isBest=b===bestBroker;
    const roi=((r.pnl/r.holdCost)*100).toFixed(2);const pc=r.pnl>=0?'profit':'loss';
    return`<div class="cc${isBest?' best':''}">
      ${isBest?'<div class="best-badge">◆ 最優惠</div>':''}
      <div class="cc-name">${brokerCfg[b].label}</div>
      <div class="cc-pnl ${pc}">${fmtSign(r.pnl)}</div>
      <div class="cc-rows-wrap">
        <div class="cc-row"><span class="cc-lbl">報酬率</span><span class="cc-v ${pc}">${r.pnl>=0?'+':''}${roi}%</span></div>
        <div class="cc-row"><span class="cc-lbl">買進費</span><span class="cc-v">$${fmt(r.buyFee)}</span></div>
        <div class="cc-row"><span class="cc-lbl">賣出費</span><span class="cc-v">$${fmt(r.sellFee)}</span></div>
        <div class="cc-row"><span class="cc-lbl">證交稅</span><span class="cc-v">$${fmt(r.tax)}</span></div>
        <div class="cc-row"><span class="cc-lbl">總費用</span><span class="cc-v">$${fmt(totalFees[b])}</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('compare-panel').style.display='block';
  setTimeout(()=>document.getElementById('compare-panel').scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}
function hideCompare(){document.getElementById('compare-panel').style.display='none';}

function roundToTick(p,t,dir){if(dir==='up')return Math.floor(p/t)*t;if(dir==='dn')return Math.ceil(p/t)*t;return Math.round(p/t)*t;}
function calcLimit(){
  const base=parseFloat(document.getElementById('base-price').value);
  
  if(!base||base<=0)return;
  const tick=getTickSize(base);
  const up=roundToTick(base*1.1,tick,'up'),dn=roundToTick(base*0.9,tick,'dn');
  const dec=tick<0.1?2:tick<1?1:0;
  document.getElementById('stock-title').textContent=`參考價 ${base} 元`;
  document.getElementById('up-limit').textContent=up.toFixed(dec);
  document.getElementById('dn-limit').textContent=dn.toFixed(dec);
  document.getElementById('up-chg').textContent=`+${((up-base)/base*100).toFixed(1)}%`;
  document.getElementById('dn-chg').textContent=`${((dn-base)/base*100).toFixed(1)}%`;
  document.getElementById('tick-info').innerHTML=`跳動單位：${tick<1?tick.toFixed(tick<0.1?2:1):tick} 元<br>漲跌幅限制：± 10%`;
  document.getElementById('limit-result').style.display='block';
  setTimeout(()=>document.getElementById('limit-result').scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

function addAvgRow(price='',qty=1000){
  const id=++avgRowId;
  const container=document.getElementById('avg-rows');
  const wrap=document.createElement('div');
  wrap.className='avg-row-wrap';wrap.id='avg-wrap-'+id;
  wrap.innerHTML=`
    <div class="row-num">${container.children.length+1}</div>
    <div class="avg-fields">
      <div class="field"><label>單價</label><input type="number" id="ap-${id}" value="${price}" placeholder="50.00" step="0.01" min="0" inputmode="decimal" oninput="liveCalcAvg()"></div>
      <div class="field"><label>股數</label>
        <div class="qty-wrap">
          <button class="icon-btn" onclick="adjustQty(${id},-100)">−</button>
          <input type="number" id="aq-${id}" value="${qty}" placeholder="1000" step="100" min="1" inputmode="numeric" oninput="liveCalcAvg()">
          <button class="icon-btn" onclick="adjustQty(${id},100)">+</button>
        </div>
      </div>
    </div>
    <button class="icon-btn del" onclick="removeAvgRow(${id})">✕</button>`;
  container.appendChild(wrap);updateRowNumbers();
}
function removeAvgRow(id){const el=document.getElementById('avg-wrap-'+id);if(el)el.remove();updateRowNumbers();liveCalcAvg();}
function adjustQty(id,d){const el=document.getElementById('aq-'+id);if(!el)return;el.value=Math.max(1,(parseInt(el.value)||0)+d);liveCalcAvg();}
function updateRowNumbers(){document.querySelectorAll('#avg-rows .avg-row-wrap').forEach((w,i)=>{const n=w.querySelector('.row-num');if(n)n.textContent=i+1;});}
function getAvgRows(){const rows=[];document.querySelectorAll('#avg-rows .avg-row-wrap').forEach(w=>{const m=w.id.match(/avg-wrap-(\d+)/);if(!m)return;const p=parseFloat(document.getElementById('ap-'+m[1])?.value);const q=parseInt(document.getElementById('aq-'+m[1])?.value);if(p>0&&q>0)rows.push({p,q});});return rows;}
function liveCalcAvg(){
  const rows=getAvgRows();
  if(!rows.length){document.getElementById('avg-result').style.display='none';return;}
  const totalCost=rows.reduce((s,r)=>s+r.p*r.q,0);
  const totalQty=rows.reduce((s,r)=>s+r.q,0);
  if(!totalQty)return;
  document.getElementById('avg-price').textContent='$'+parseFloat((totalCost/totalQty).toFixed(2)).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('avg-total-qty').textContent=totalQty.toLocaleString('zh-TW')+' 股';
  document.getElementById('avg-total-cost').textContent='$'+Math.round(totalCost).toLocaleString('zh-TW');
  document.getElementById('avg-breakdown').innerHTML=rows.map((r,i)=>`
    <div class="avg-detail-row"><span style="color:var(--text2)">第${i+1}筆 $${r.p}×${r.q.toLocaleString('zh-TW')}股</span><span style="font-family:var(--mono);font-weight:500;color:#F5EED8">$${Math.round(r.p*r.q).toLocaleString('zh-TW')}</span></div>`).join('');
  document.getElementById('avg-result').style.display='block';
}
function calcAvg(){liveCalcAvg();}
function switchTab(idx){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.section').forEach((s,i)=>s.classList.toggle('active',i===idx));
  window.scrollTo({top:0,behavior:'smooth'});
}
renderBrokerInfo('shinekong');
addAvgRow('',1000);
addAvgRow('',1000);
</script>
</body>
</html>
